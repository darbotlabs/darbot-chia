name: 🚨 pre-commit

on:
  pull_request:
  push:
    branches:
      - "long_lived/**"
      - main
      - "release/**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: ${{ matrix.os.name }} ${{ matrix.arch.name }} ${{ matrix.python.major_dot_minor }}
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            matrix: linux
            runs-on:
              intel: ubuntu-latest
              arm: [linux, arm64]
          - name: macOS
            matrix: macos
            runs-on:
              intel: macos-13
              arm: macos-13-arm64
          - name: Windows
            matrix: windows
            runs-on:
              intel: windows-latest
        arch:
          - name: ARM64
            matrix: arm
          - name: Intel
            matrix: intel
        python:
          - major_dot_minor: "3.9"
          - major_dot_minor: "3.10"
          - major_dot_minor: "3.11"
          - major_dot_minor: "3.12"
        exclude:
          - os:
              matrix: windows
            arch:
              matrix: arm

    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning workspace..."
          rm -rf ./* 2>/dev/null || true
          rm -rf ./.* 2>/dev/null || true

      - name: Mark workspace as safe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: disable git autocrlf
        run: |
          git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python.major_dot_minor }}

      - uses: ./.github/actions/install
        with:
          python-version: ${{ matrix.python.major_dot_minor }}
          development: true

      - name: Activate virtual environment
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            source venv/Scripts/activate
            echo "PATH=$PATH" >> $GITHUB_ENV
            echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          else
            source venv/bin/activate
            echo "PATH=$PATH" >> $GITHUB_ENV
            echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          fi

      - env:
          CHIA_MANAGE_CLVM_CHECK_USE_CACHE: "false"
          CHIA_MANAGE_MYPY_CHECK_EXCLUSIONS: "true"
        run: pre-commit run --all-files --verbose
