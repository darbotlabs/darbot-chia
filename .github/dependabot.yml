# This file is managed by the repo-content-updater project. Manual changes here will result in a PR to bring back
# inline with the upstream template, unless you remove the dependabot managed file property from the repo

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: /
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      global:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: /
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 10
    rebase-strategy: auto

  - package-ecosystem: "github-actions"
    directories: ["/", ".github/actions/*"]
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 10
    rebase-strategy: auto

  - package-ecosystem: "npm"
    directory: /
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 10
    rebase-strategy: auto

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 10
    rebase-strategy: auto

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 10
    rebase-strategy: auto
